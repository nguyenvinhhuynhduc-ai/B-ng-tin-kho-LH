<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#15803d" />
    <meta name="description" content="Ghi nhận ra vào kho — ứng dụng ghi nhận người và phương tiện ra vào kho" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ra vào kho" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Ghi nhận ra vào kho</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Offline / boot loading screen — hidden once React mounts -->
    <div id="boot-loader" style="
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #15803d; color: white; font-family: system-ui, sans-serif; z-index: 9999;
    ">
      <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em;">Ghi nhận ra vào kho</div>
      <div style="width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        // give React a tick to mount, then fade the boot loader out
        setTimeout(function () {
          var el = document.getElementById('boot-loader');
          if (el) {
            el.style.transition = 'opacity 0.25s ease';
            el.style.opacity = '0';
            setTimeout(function () { el.remove(); }, 300);
          }
        }, 400);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
